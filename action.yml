name: SafeTS Runtime Safety Check
description: Find common runtime crashes TypeScript cannot detect.
author: Dioman-Keita

branding:
  icon: shield
  color: blue

inputs:
  command:
    description: SafeTS command to run.
    required: false
    default: doctor
  version:
    description: SafeTS npm version to execute.
    required: false
    default: latest
  working-directory:
    description: Directory where SafeTS should run.
    required: false
    default: .
  fail-on-new:
    description: Block the workflow when doctor finds crashes not present in the baseline.
    required: false
    default: "false"
  include-tests:
    description: Include test files in the analysis.
    required: false
    default: "false"
  json:
    description: Print machine-readable JSON output.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Run SafeTS
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        INPUT_INCLUDE_TESTS: ${{ inputs.include-tests }}
        INPUT_JSON: ${{ inputs.json }}
      run: |
        set -euo pipefail

        args=("$INPUT_COMMAND")

        if [[ "$INPUT_FAIL_ON_NEW" == "true" ]]; then
          args+=("--fail-on-new")
        fi

        if [[ "$INPUT_INCLUDE_TESTS" == "true" ]]; then
          args+=("--include-tests")
        fi

        if [[ "$INPUT_JSON" == "true" ]]; then
          args+=("--json")
        fi

        safets_dir="$(mktemp -d)"
        trap 'rm -rf "$safets_dir"' EXIT

        npm install --prefix "$safets_dir" --no-save --silent "@safets-org/cli@$INPUT_VERSION"
        "$safets_dir/node_modules/.bin/safets" "${args[@]}"
