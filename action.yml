name: SafeTS
description: Find common runtime crashes TypeScript cannot detect.
author: Dioman-Keita

branding:
  icon: shield
  color: blue

inputs:
  command:
    description: SafeTS command to run.
    required: false
    default: doctor
  version:
    description: SafeTS npm version to execute.
    required: false
    default: latest
  working-directory:
    description: Directory where SafeTS should run.
    required: false
    default: .
  fail-on-new:
    description: Block the workflow when doctor finds crashes not present in the baseline.
    required: false
    default: "false"
  include-tests:
    description: Include test files in the analysis.
    required: false
    default: "false"
  json:
    description: Print machine-readable JSON output.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Run SafeTS
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        args=("${{ inputs.command }}")

        if [[ "${{ inputs.fail-on-new }}" == "true" ]]; then
          args+=("--fail-on-new")
        fi

        if [[ "${{ inputs.include-tests }}" == "true" ]]; then
          args+=("--include-tests")
        fi

        if [[ "${{ inputs.json }}" == "true" ]]; then
          args+=("--json")
        fi

        npx --yes "safets@${{ inputs.version }}" "${args[@]}"
