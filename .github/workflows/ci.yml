name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build compiled CLI
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test CLI
        run: npm test

      - name: Verify npm package contents
        run: npm run pack:check

  package-smoke:
    name: Package smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pack package
        run: npm pack

      - name: Install packed package in isolated sample project
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="$(ls safets-*.tgz)"
          mkdir smoke-project
          cd smoke-project
          npm init -y
          npm install ../"$TARBALL" typescript @types/node
          test -f node_modules/safets/package.json
          test -f node_modules/safets/dist/index.js
          node -e 'const pkg=require("./node_modules/safets/package.json"); if (pkg.bin?.safets !== "./dist/index.js") { throw new Error("unexpected bin entry"); }'
          npx safets doctor > output.txt
          grep -q "SafeTS v" output.txt
          grep -Eq "OK No potential runtime crashes found|Runtime Safety Report" output.txt
